fraction_bits = 16
accumulator_rule = "plena_fixed16_16_accumulate_truncate"
writeout_rule = "truncate_to_vector_format"

[TRANSACTIONAL.PRECISION.MATRIX_SEMANTICS.instruction_reduction]
