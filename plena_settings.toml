# ============================================================================
# TRANSACTIONAL SIMULATOR CONFIGURATION
# ============================================================================

[TRANSACTIONAL.CONFIG.DC_EN]
value = 1

[TRANSACTIONAL.CONFIG.MAX_LOOP_INSTRUCTIONS]
value = 100000

[TRANSACTIONAL.CONFIG.BLEN]
value = 4

[TRANSACTIONAL.CONFIG.HLEN]
value = 16

[TRANSACTIONAL.CONFIG.MLEN]
value = 64

[TRANSACTIONAL.CONFIG.VLEN]
value = 64

[TRANSACTIONAL.CONFIG.BROADCAST_AMOUNT]
value = 4

[TRANSACTIONAL.CONFIG.HBM_SIZE]
# Modeled HBM capacity. The emulator eagerly allocates and zero-fills this much
# host RAM at startup (see lib/memory MemoryBacked), so it must fit within the
# host memory budget. Raise it only when a larger measured workload requires it.
value = 17179869184   # 16 GiB (was 128 GiB)

[TRANSACTIONAL.CONFIG.HBM_WIDTH]
value = 512

[TRANSACTIONAL.CONFIG.HBM_GEN]
# HBM generation for the Ramulator timing model: "HBM2" or "HBM3".
# (gen, channels) is the source of truth for emulator HBM geometry; CLI
# --hbm-gen overrides.
value = "HBM2"

[TRANSACTIONAL.CONFIG.HBM_CHANNELS]
# Number of HBM channels in the Ramulator model. CLI --hbm-channels overrides.
value = 8

[TRANSACTIONAL.CONFIG.MATRIX_SRAM_SIZE]
value = 4096

[TRANSACTIONAL.CONFIG.VECTOR_SRAM_SIZE]
value = 65536


[TRANSACTIONAL.CONFIG.FP_SRAM_DEPTH]
# Scalar FP SRAM slots, matching FP_SRAM_DEPTH in the RTL's
# definitions/configuration.svh. The decode flash-attention lowering tiles its
# query rows to fit this budget, so it is the hardware constraint the lowering
# is held to rather than a value chosen to accommodate the program.
value = 512
[TRANSACTIONAL.CONFIG.HBM_M_Prefetch_Amount]
value = 64

[TRANSACTIONAL.CONFIG.HBM_V_Prefetch_Amount]
value = 4

[TRANSACTIONAL.CONFIG.HBM_V_Writeback_Amount]
value = 4

