left_role = "activation"
right_role = "weight"
family = "mxfp"
rule = "product_cast_to_m_fp_then_fixed16_16_bank"
structurally_supported = true
numerical_trace_conformance = "not_run"

[[TRANSACTIONAL.PRECISION.MATRIX_SEMANTICS.operation_bindings]]
