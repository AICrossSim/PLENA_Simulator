# PLENA Simulator Configuration
# Set active_mode to "analytic" or "transactional" to select which configuration to use

[MODE]
active = "analytic"  # Options: "analytic" or "transactional"

# ============================================================================
# ANALYTIC MODEL CONFIGURATION
# ============================================================================

[ANALYTIC.CONFIG.DC_EN]
value = 1

[ANALYTIC.CONFIG.MAX_LOOP_INSTRUCTIONS]
value = 10000

[ANALYTIC.CONFIG.BLEN]
value = 4

[ANALYTIC.CONFIG.HLEN]
value = 128

[ANALYTIC.CONFIG.MLEN]
value = 1024

# The compiler requires VLEN == MLEN (matched matrix/vector tile widths; the embedding
# template additionally asserts hidden_size % VLEN == 0), so VLEN follows MLEN above.
[ANALYTIC.CONFIG.VLEN]
value = 1024

[ANALYTIC.CONFIG.BROADCAST_AMOUNT]
# One broadcast lane per HLEN-wide head.
value = 8

[ANALYTIC.CONFIG.HBM_SIZE]
value = 144000000000

# 512 GB/s at 1 GHz = 4096 bits/cycle. Sized so MLEN*KV_WIDTH <= HBM_WIDTH.
[ANALYTIC.CONFIG.HBM_WIDTH]
value = 4096

[ANALYTIC.CONFIG.MATRIX_SRAM_SIZE]
# Row depth. At MLEN=1024 this provides the compiler's four 1024x1024 tiles.
value = 4096

[ANALYTIC.CONFIG.FP_SRAM_DEPTH]
# Scalar FP SRAM slots. The online softmax holds three running scalars per query
# row per query head on top of the shared constants. This depth bounds the query
# tile and the number of KV groups whose state can remain live together; tiling
# distinct sequences does not add KV-cache reread traffic.
# 512 matches FP_SRAM_DEPTH in the RTL's definitions/configuration.svh.
value = 512

[ANALYTIC.CONFIG.VECTOR_SRAM_SIZE]
value = 65536

# Rows prefetched per matrix load; one native transfer is one MLEN tile.
[ANALYTIC.CONFIG.HBM_M_Prefetch_Amount]
value = 1024

[ANALYTIC.CONFIG.HBM_V_Prefetch_Amount]
value = 16

[ANALYTIC.CONFIG.HBM_V_Writeback_Amount]
value = 16

[ANALYTIC.PRECISION.MATRIX_SRAM_TYPE]
format = "Plain"
[ANALYTIC.PRECISION.MATRIX_SRAM_TYPE.DATA_TYPE]
type = "Fp"
sign = true
exponent = 8
mantissa = 7

[ANALYTIC.PRECISION.VECTOR_SRAM_TYPE]
format = "Plain"
[ANALYTIC.PRECISION.VECTOR_SRAM_TYPE.DATA_TYPE]
type = "Fp"
sign = true
exponent = 8
mantissa = 7

# MX block 8 is shared by the numerical search, emulator, compiler, and RTL datapath.
[ANALYTIC.PRECISION.HBM_M_WEIGHT_TYPE]
format = "Mx"
block = 8
[ANALYTIC.PRECISION.HBM_M_WEIGHT_TYPE.ELEM]
type = "Fp"
sign = true
exponent = 4
mantissa = 3
[ANALYTIC.PRECISION.HBM_M_WEIGHT_TYPE.SCALE]
type = "Fp"
sign = false
exponent = 8
mantissa = 0

[ANALYTIC.PRECISION.HBM_M_KV_TYPE]
format = "Mx"
block = 8
[ANALYTIC.PRECISION.HBM_M_KV_TYPE.ELEM]
type = "Fp"
sign = true
exponent = 4
mantissa = 3
[ANALYTIC.PRECISION.HBM_M_KV_TYPE.SCALE]
type = "Fp"
sign = false
exponent = 8
mantissa = 0

[ANALYTIC.PRECISION.HBM_V_ACT_TYPE]
format = "Mx"
block = 8
[ANALYTIC.PRECISION.HBM_V_ACT_TYPE.ELEM]
type = "Fp"
sign = true
exponent = 4
mantissa = 3
[ANALYTIC.PRECISION.HBM_V_ACT_TYPE.SCALE]
type = "Fp"
sign = false
exponent = 8
mantissa = 0

[ANALYTIC.PRECISION.HBM_V_KV_TYPE]
format = "Mx"
block = 8
[ANALYTIC.PRECISION.HBM_V_KV_TYPE.ELEM]
type = "Fp"
sign = true
exponent = 4
mantissa = 3
[ANALYTIC.PRECISION.HBM_V_KV_TYPE.SCALE]
type = "Fp"
sign = false
exponent = 8
mantissa = 0

[ANALYTIC.PRECISION.HBM_V_INT_TYPE]
format = "Plain"
[ANALYTIC.PRECISION.HBM_V_INT_TYPE.DATA_TYPE]
type = "Int"
width = 32

[ANALYTIC.PRECISION.SCALAR_FP]
type = "Fp"
sign = true
exponent = 8
mantissa = 7

[ANALYTIC.LATENCY.SYSTOLIC_PROCESSING_OVERHEAD]
dc_lib_en = 0
dc_lib_dis = 0

[ANALYTIC.LATENCY.VECTOR_LONGEST_OPERATE_CYCLES]
