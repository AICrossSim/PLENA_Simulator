name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run hybrid pre-RTL model guards
        run: |
          uv run python -m pytest -q \
            analytic_models/performance/test_nemotron3_workload.py \
            analytic_models/performance/test_kimi_k3_workload.py \
            analytic_models/performance/test_hybrid_system_timeline.py \
            analytic_models/performance/test_hybrid_system_dse.py \
            analytic_models/performance/test_hybrid_routing_trace.py \
            transactional_emulator/testbench/test_hybrid_isa_freeze_sync.py
